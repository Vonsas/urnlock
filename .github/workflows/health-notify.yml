# 배포 결과 알림 (2026-10-29) — Vercel 이 Production 배포 결과(성공 · 실패)를 GitHub 에 알리면 돈다.
# 성공: 배포된 /health.json 을 읽어 번역 필요 · 새 영웅 · 새 패치를 이슈로 열고 닫는다. 실패: '배포 빌드가 실패했어요' 이슈.
# 저장소 시크릿 DISCORD_WEBHOOK(디스코드 채널 설정 → 연동 → 웹후크 주소)이 있으면 같은 알림을 그 채널에도 보낸다.
# 예전엔 daily-rebuild 가 배포 반영을 최대 20분 기다리며 확인해 Actions 무료 시간을 대부분 썼다 — 이제 결과가 왔을 때 1분 안팎만 돈다.
name: health-notify

on:
  deployment_status:
  workflow_dispatch: # Actions 탭에서 수동 실행 — 디스코드 연결 확인 메시지를 보낸다

permissions:
  contents: read
  issues: write

jobs:
  notify:
    # Preview 배포 · 진행 중 · 밀려남(inactive) 알림은 건너뜀
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.deployment.environment == 'Production' &&
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 배포된 커밋이 아니라 최신 점검 스크립트로

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 점검 결과 알림
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_DESCRIPTION: ${{ github.event.deployment_status.description }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/check-health.mjs --test
          else
            node tools/check-health.mjs --status "${{ github.event.deployment_status.state }}"
          fi
