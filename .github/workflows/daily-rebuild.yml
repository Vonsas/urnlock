# 6시간마다 (2026-10-14, 예전 하루 한 번 — 새 영웅이 수·토 06시에 나와 하루 가까이 늦게 반영됐다) — ① 패치노트 보관(새 Steam 패치를 src/data/patch-archive.json 에 쌓음)
# ② 티어 조각 보관(랭크 단계별 숙련자 수치를 하루 조각으로 src/data/tier-archive.json 에 쌓음 — 2026-10-29, docs/deploy-failures.md) ③ Vercel 재배포.
# 빌드 때 deadlock-api 에서 승률·빌드·패치노트를 새로 받고, 티어 단계별 수치는 조각 파일을 더한다.
# 보관 파일이 바뀌면 커밋·푸시하고(그 푸시로 Vercel 이 배포), 안 바뀌었으면 Deploy Hook 을 부른다 (두 번 배포하지 않게).
# 배포 결과 확인 · 알림은 health-notify.yml 이 Vercel 의 결과 알림을 받아 한다 (예전엔 여기서 최대 20분 기다려 Actions 시간을 대부분 썼다).
# www 는 Cloudflare Pages (#55) — Vercel 운영 빌드가 끝나며 같은 dist 를 올린다(tools/vercel-to-pages.mjs). 그 길이 막혀 www 데이터가 9시간 넘게 그대로면
# 마지막 단계가 pages-standby 를 실행해 Actions 에서 따로 새로 한다 (GITHUB_TOKEN 으로 부른 workflow_dispatch 는 실행된다).
# VERCEL_DEPLOY_HOOK: Vercel 프로젝트 Settings → Git → Deploy Hooks 에서 만든 주소 (GitHub 저장소 Settings → Secrets → Actions 에 저장)
# 깨우기 (2026-11-02): GitHub 예약이 3–4시간씩 밀리거나 빠져(11/2 07:37 · 13:37 둘 다 안 돎) Cloudflare Worker(workers/rebuild-trigger)가 같은 시각에
# workflow_dispatch 로 부른다. 이 schedule 은 예비 — Worker 가 살아 있으면(최근 6시간 10분 안에 Worker 실행) 예약 실행은 첫 단계에서 스스로 취소한다(취소된 실행은 아래 '바로 앞 실행' 셈에서 뺀다).
name: daily-rebuild
# Worker 가 부른 실행은 이름이 'daily-rebuild (Worker)' — 아래 첫 단계가 이 이름과 '(patch-…)' 로 Worker 실행만 센다 (수동 실행은 세지 않게)
# 새 Steam 글을 본 Worker 가 부르면 source=patch-{글 번호} → 'daily-rebuild (patch-…)' (Worker 가 같은 글로 두 번 부르지 않게 이 이름을 센다)
run-name: ${{ inputs.source == 'worker' && 'daily-rebuild (Worker)' || startsWith(inputs.source, 'patch-') && format('daily-rebuild ({0})', inputs.source) || github.workflow }}

on:
  schedule:
    - cron: '37 4,10,16,22 * * *' # 01:37 · 07:37 · 13:37 · 19:37 KST — 정각은 GitHub 에 실행이 몰려 3–4시간씩 밀렸다 (정각을 피하라는 GitHub 안내)
  workflow_dispatch: # Actions 탭에서 수동 실행
    inputs:
      usage_scale:
        description: '사용량 점검 시험 — 한도에 곱할 수 (예 0.001 이면 이슈가 열린다). 비우면 실제 한도'
        required: false
        default: ''
      source:
        description: '부른 곳 — Worker 가 worker(6시간) · patch-{글 번호}(새 Steam 글)를 넣는다. 수동 실행은 비워 둘 것 (worker 를 넣으면 대소문자 상관없이 Worker 실행으로 세어 6시간 10분 동안 예비 예약이 취소된다)'
        required: false
        default: ''

# 늦게 시작한 실행이 다음 실행과 겹치지 않게
concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write # 패치 보관 파일 커밋
  issues: write # 점검 결과 알림
  actions: write # www 데이터가 밀렸을 때 pages-standby 실행 (마지막 단계)

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 예약 실행만 — Worker 가 부른 실행('daily-rebuild (Worker)' · '(patch-…)')이 최근 6시간 10분 안에 있으면(도는 중 · 성공) Worker 가 살아 있다는 뜻이라 늦게 온 이 예약 실행을 취소한다.
      # Worker 가 멈추면 Worker 실행이 끊겨 예약이 그대로 돈다(예비). 6h10m = 예약 간격 6시간 + 여유 — 예약은 실제로 +23m – +5h57m 늦게 왔다(10/31 – 11/2).
      # 수동 실행은 세지 않는다 — 세면 Worker 가 없을 때 수동 실행이 다음 차례 예약까지 지운다 (#84 2차 리뷰).
      # 따로 작업으로 두면 실행마다 Actions 1분이 더 들어 첫 단계에 둔다. 취소가 실패하면 그냥 빌드한다(두 번 빌드일 뿐) — 60초 안에 취소가 안 닿으면 다음 단계 도중에 끊긴다(해 없음)
      - name: 늦게 온 예약 실행이면 취소 (Worker 가 이미 깨움)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          woke=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily-rebuild.yml --event workflow_dispatch --limit 10 --json displayTitle,createdAt,status,conclusion \
            -q '[.[] | select(.displayTitle == "daily-rebuild (Worker)" or (.displayTitle | startswith("daily-rebuild (patch-"))) | select(now - (.createdAt | fromdateiso8601) < 22200) | select(.status != "completed" or .conclusion == "success")] | length' || echo 0)
          if [ "${woke:-0}" -gt 0 ]; then
            echo "::notice::Worker 가 최근 6시간 10분 안에 갱신을 깨움 — 이 예약 실행은 취소"
            gh run cancel -R "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" || true
            sleep 60
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 사이트 데이터가 오래됐는지 (30시간 넘게 그대로면 이슈 · 디스코드)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node tools/check-health.mjs --stale || echo "확인 건너뜀"

      - name: 무료 한도 사용량 (70% · 90% · 넘음에 이슈 · 디스코드)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          SCALE: ${{ inputs.usage_scale }}
        # 시크릿이 없는 서비스는 건너뛰고, 실패해도 재배포는 계속한다
        run: node tools/check-usage.mjs ${SCALE:+--scale "$SCALE"} || echo "사용량 점검 건너뜀"

      - name: 패치노트 보관
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          # 보관이 실패해도(API 응답 없음 등) 재배포는 계속한다
          # Worker 가 새 글을 보고 부른 실행(source=patch-{번호})이면 그 글이 API 목록에 들어올 때까지 잠시 기다린다 (스크립트가 숫자만 받음)
          case "$SOURCE" in patch-*) export EXPECT_POST="${SOURCE#patch-}" ;; esac
          node tools/archive-patches.mjs || echo "패치 보관 건너뜀"

      - name: 티어 조각 보관
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          # 못 받은 조각은 예전 값을 두고 다음 실행에서 다시 — 빌드는 빈 칸만 직접 받는다. 25분을 넘기면 멈춘다
          # 새 패치로 부른 실행(source=patch-…)은 3분까지만 — 새 패치 경계 조각만 받으면 되고, 번역 호출 · 배포를 늦추지 않게 (2026-11-05)
          # (건너뛰면 조각 파일 끝이 새 패치 시각보다 앞이라 '현재 패치' 보드가 비어 health 검사가 배포를 멈춘다 — #132 리뷰)
          budget=25
          case "$SOURCE" in patch-*) budget=3 ;; esac
          npx --yes tsx@4.23.15 tools/archive-tiers.ts --budget "$budget" || echo "티어 조각 보관 건너뜀"

      - name: 보관 파일이 바뀌었는지
        id: archive
        run: |
          if git diff --quiet -- src/data/patch-archive.json src/data/tier-archive.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 바뀐 보관 파일 커밋 (이 푸시로 Vercel 이 배포)
        id: commit
        if: steps.archive.outputs.changed == 'true'
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/patch-archive.json src/data/tier-archive.json
          # 새 패치로 부른 실행의 커밋은 [data-reuse] — 빌드가 다른 데이터(지표 · 빌드 · 라인전)를 6시간 안쪽 캐시로 써서 약 1분에 끝난다 (src/data/api/fetch.ts DATA_REUSE).
          # 티어는 방금 받은 조각 파일에서 계산하므로 새 패치 기간도 맞다
          case "$SOURCE" in patch-*) git commit -m "chore(data): archive patch notes and tier pieces [data-reuse]" ;; *) git commit -m "chore(data): archive patch notes and tier pieces" ;; esac
          # 그 사이 main 에 다른 푸시가 있었으면 그 위로 올린다
          git pull --rebase
          # 이 푸시가 패치 보관 파일을 실제로 바꾸는지 — rebase 뒤에 잰다 (대기하던 실행이 앞 실행과 같은 글을 다시 보관하면 rebase 에서 사라져, 번역을 두 번 부르지 않게 · #108 리뷰)
          if git diff --quiet origin/main HEAD -- src/data/patch-archive.json; then patches=false; else patches=true; fi
          git push
          echo "patches=$patches" >> "$GITHUB_OUTPUT"

      # 패치노트 번역 예약 작업(claude.ai 'Urnlock 패치노트 자동 번역')을 바로 부른다 — 예약(10시 · 22시)을 기다리지 않게 (2026-11-04, docs/plan-patch-watch.md).
      # 루틴의 GitHub 트리거는 push 를 받지 않아 API 트리거(/fire)로. 시크릿 ROUTINE_FIRE_URL · ROUTINE_FIRE_TOKEN 은 그 루틴 편집 → 트리거 추가 → API → Generate token 에서
      # (토큰은 이 루틴 하나만 실행할 수 있고 읽기 권한 없음). 없으면 건너뛰고, 실패해도 이 실행은 계속한다 — 예약이 예비. 영웅 출시 공지만 보관돼도 부르는데 번역할 줄이 없으면 30초에 끝난다.
      - name: 번역 예약 작업 부르기 (패치 보관 파일을 푸시했을 때)
        if: steps.commit.outputs.patches == 'true'
        env:
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then echo "ROUTINE_FIRE_URL · ROUTINE_FIRE_TOKEN 시크릿이 없어 건너뜀 (예약 10시 · 22시에 번역)"; exit 0; fi
          # 응답 본문은 버린다 (세션 주소만 오지만 로그에 남길 이유가 없다). 연결 실패면 curl 이 000 을 찍는다
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" -H "anthropic-version: 2026-10-21" -H "Content-Type: application/json" \
            -d '{"text": "새 Steam 패치 글을 patch-archive.json 에 보관해 main 에 푸시했다 (daily-rebuild). 번역할 줄이 있으면 번역해 줘."}' || true)
          if [ "$code" = 200 ]; then echo "번역 예약 작업 실행됨"; else echo "::warning::번역 예약 작업을 부르지 못함 (HTTP $code) — 예약 10시 · 22시에 번역"; fi

      - name: Vercel Deploy Hook 호출
        if: steps.archive.outputs.changed != 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK 시크릿이 없습니다"; exit 1; fi
          curl -fsS -X POST "$HOOK"

      # www(= Cloudflare Pages, #55)는 Vercel 운영 빌드가 끝나며 올린다. 그 길이 막혔을 때만(Vercel 이 한도로 멈춤 · 올리기 실패) pages-standby 로 따로 새로 한다.
      # 판별: www 의 health.json 이 9시간 넘게 그대로 = 직전 6시간 갱신이 www 에 닿지 못함. 앞 단계가 실패해도(Vercel 이 멈춰 Hook 실패 등) 돈다.
      # 티어 데이터 점검에 걸려 안 올린 경우도 여기 걸리는데, 그때는 pages-standby 도 같은 점검에 걸린다 — 점검이 며칠 걸리면 6시간마다 10분씩 헛돌아
      # Actions 무료 시간(월 2,000분)을 먹으므로, pages-standby 가 아직 도는 중이거나 바로 앞 차례(이 작업의 직전 실행 이후)에 실패 · 시간 초과 · 취소됐으면 이번엔 부르지 않는다
      # → 실패가 이어지면 한 차례 걸러 한 번 돈다 (그 실패는 --stale 이 30시간에 알린다). 시간 창으로 재지 않는 까닭: 예약 실행이 23분–6시간 늦게 시작해 간격이 4–10시간으로 흔들린다.
      - name: www 데이터가 9시간 넘게 그대로면 Pages 를 따로 새로 (pages-standby 실행)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          standby() {
            last=$(gh run list --workflow pages-standby.yml --limit 1 --json status,conclusion,createdAt \
              -q '.[0] // empty | "\(.status)|\(.conclusion)|\(.createdAt | fromdateiso8601)"' || true)
            # '|' 로 나눈다 — 도는 중이면 conclusion 이 비어 있어 공백으로 나누면 칸이 밀린다
            IFS='|' read -r status conclusion created <<< "$last"
            # 이 작업의 바로 앞 실행이 시작된 시각 (지금 도는 이 실행은 뺀다)
            # 첫 단계가 취소한 늦은 예약 실행은 빼고 센다
            prev=$(gh run list --workflow daily-rebuild.yml --limit 6 --json databaseId,createdAt,conclusion \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion != \"cancelled\")][0].createdAt // empty | fromdateiso8601" || true)
            if [ -n "$created" ]; then
              if [ "$status" != "completed" ]; then echo "pages-standby 가 아직 도는 중 — 이번엔 부르지 않음"; return; fi
              case "$conclusion" in
                failure|timed_out|cancelled)
                  if [ -n "$prev" ] && [ "$created" -ge "$prev" ]; then
                    echo "::notice::바로 앞 차례의 pages-standby 가 실패($conclusion) — 이번엔 부르지 않음 (같은 점검에 다시 걸리기 쉬움, 다음 차례에 다시)"; return
                  fi ;;
              esac
            fi
            gh workflow run pages-standby.yml --ref main
          }
          if ! built=$(curl -fsS --max-time 20 -A "urnlock-daily-rebuild" "https://www.urnlock.com/health.json?t=$(date +%s)" | jq -er '.builtAt | floor'); then
            echo "::warning::www 의 health.json 을 읽지 못함 — pages-standby 실행"
            standby
            exit 0
          fi
          age=$(( $(date +%s) - built ))
          if [ "$age" -gt $((9 * 3600)) ]; then
            echo "www 데이터가 $((age / 3600))시간째 그대로 — pages-standby 실행"
            standby
          else
            echo "www 데이터 $((age / 60))분 전 — Pages 는 Vercel 운영 빌드가 올린다"
          fi
